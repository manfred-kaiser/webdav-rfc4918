<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E88E5"/>
      <stop offset="1" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="96" height="96" rx="20" fill="url(#bg)"/>

  <!-- Folder body -->
  <path d="M18 34
           c0,-3.3 2.7,-6 6,-6
           h14 l6,7 h28
           c3.3,0 6,2.7 6,6
           v31
           c0,3.3 -2.7,6 -6,6
           H24
           c-3.3,0 -6,-2.7 -6,-6
           z"
        fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Folder tab shadow line -->
  <path d="M18 34 h26 l6 7 H18 z" fill="#0D47A1" fill-opacity="0.12"/>

  <!-- Transfer arrows: remote <-> local -->
  <g stroke="#1565C0" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 58 h16"/>
    <path d="M40 58 l6 -6"/>
    <path d="M40 58 l6 6"/>
    <path d="M56 58 l-6 -6"/>
    <path d="M56 58 l-6 6"/>
  </g>

  <!-- Lock badge: secure by default -->
  <circle cx="72" cy="66" r="15" fill="#FFFFFF"/>
  <circle cx="72" cy="66" r="15" fill="none" stroke="#0D47A1" stroke-width="2"/>
  <g fill="#1565C0">
    <rect x="66" y="64" width="12" height="9" rx="2"/>
    <path d="M68.5 64 v-3 a3.5 3.5 0 0 1 7 0 v3 h-2.4 v-3 a1.1 1.1 0 0 0 -2.2 0 v3 z"/>
  </g>
</svg>
