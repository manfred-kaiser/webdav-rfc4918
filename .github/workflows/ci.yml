name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install hatch
      run: |
        python -m pip install pip==26.2.1
        python -m pip install hatch==1.18.0
    - name: Lint and type-check
      run: hatch run +py=${{ matrix.python-version }} lint:check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install hatch
      run: |
        python -m pip install pip==26.2.1
        python -m pip install hatch==1.18.0
    - name: Run tests (against a real wsgidav server, see tests/server.py)
      run: hatch test -i py=${{ matrix.python-version }}

  # The declared lower bounds (pyproject.toml) actually work - and are ones without a
  # known vulnerability (they were raised past requests CVE-2024-35195/-47081 and
  # urllib3 CVE-2026-44431/-44432): the session leans
  # on a few requests internals (get_redirect_target, merge_environment_settings,
  # PreparedRequest.prepare_url), which only a run against the oldest release
  # notices when they change.
  compat:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install the oldest supported requests/urllib3
      run: |
        python -m pip install pip==26.2.1
        python -m pip install "requests==2.32.4" "urllib3==2.7.0" -e "." \
          pytest pytest-cov pytest-xdist cheroot wsgidav typing-extensions hypothesis
    - name: Run tests
      run: python -m pytest tests/

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Install hatch
      run: |
        python -m pip install pip==26.2.1
        python -m pip install hatch==1.18.0
    - name: Build docs
      run: hatch run docs:build

  # Cross-check against a real, independent server implementation - this
  # project's actual deployment target, not just wsgidav (see
  # docs/apache-compliance-check.md). New (not yet proven stable across many
  # runs) and only covers one distro's Apache build, so continue-on-error
  # for now rather than blocking on day one - promote to a required check
  # once it has been green for a while.
  apache:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Install Apache + mod_dav
      run: |
        sudo apt-get update
        sudo apt-get install -y apache2 apache2-utils
    - name: Install hatch
      run: |
        python -m pip install pip==26.2.1
        python -m pip install hatch==1.18.0
    - name: Run the Apache compliance check (starts/stops its own instance - see tests/apache_instance.py)
      run: hatch test tests/test_apache_compliance.py -v
