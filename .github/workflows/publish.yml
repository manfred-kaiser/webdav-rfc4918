name: Publish

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'
        # (no `cache: pip` here: a cache written by a pull-request run must never be
        # able to reach the build a release is made from)
    - name: Check the release tag matches the package version
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'EOF'
        import os, re, sys, tomllib
        tag = os.environ["TAG"].removeprefix("v")
        with open("pyproject.toml", "rb") as f:
            declared = tomllib.load(f)["project"]["version"]
        with open("src/webdav/__init__.py", encoding="utf-8") as f:
            in_code = re.search(r'^__version__ = "([^"]+)"', f.read(), re.M).group(1)
        if not (tag == declared == in_code):
            sys.exit(f"tag {tag!r}, pyproject {declared!r} and __version__ {in_code!r} must agree")
        EOF
    - name: Install build
      run: |
        python -m pip install pip==26.2.1
        python -m pip install build==1.6.1
    - name: Build sdist and wheel
      run: python -m build
    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/webdav-rfc4918/
    permissions:
      # Mandatory for PyPI trusted publishing (OIDC) - no API token needed
      # or stored in this repo.
      id-token: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
