name: Publish

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        # the whole history, so the check below can tell whether the release commit is on main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.13'
        # (no `cache: pip` here: a cache written by a pull-request run must never be
        # able to reach the build a release is made from)
    - name: Check the release tag matches the package version
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'EOF'
        import os, re, sys, tomllib
        tag = os.environ["TAG"].removeprefix("v")
        with open("pyproject.toml", "rb") as f:
            declared = tomllib.load(f)["project"]["version"]
        with open("src/webdav/__init__.py", encoding="utf-8") as f:
            in_code = re.search(r'^__version__ = "([^"]+)"', f.read(), re.M).group(1)
        if not (tag == declared == in_code):
            sys.exit(f"tag {tag!r}, pyproject {declared!r} and __version__ {in_code!r} must agree")
        EOF
    - name: Check the release commit is on main
      run: |
        # (a tag on a feature branch or a fork-only commit must not reach PyPI)
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
          || { echo "::error::$GITHUB_SHA is not an ancestor of origin/main"; exit 1; }
    - name: Install build
      run: |
        python -m pip install pip==26.2.1
        python -m pip install build==1.6.1
    - name: Build sdist and wheel
      run: python -m build
    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/webdav-rfc4918/
    permissions:
      # Mandatory for PyPI trusted publishing (OIDC) - no API token needed
      # or stored in this repo.
      id-token: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
