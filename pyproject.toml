[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling==1.31.0" ]

[project]
name = "webdav-rfc4918"
version = "0.1.0"
description = "RFC 4918 compliant WebDAV client, built on requests, with an fsspec filesystem and a CLI"
readme = "README.md"
keywords = [ "fsspec", "mtls", "rfc4918", "webdav", "webdav-cli", "webdav-client" ]
license = { text = "MIT" }
authors = [ { name = "Manfred Kaiser", email = "manfred.kaiser@ssh-mitm.at" } ]
maintainers = [ { name = "Manfred Kaiser", email = "manfred.kaiser@ssh-mitm.at" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [ "python-dateutil>=2.8.1", "requests>=2.31,<3" ]

[project.scripts]
dav = "webdav.cli:main"

[project.optional-dependencies]
all = [ "webdav-rfc4918[cli,fsspec]" ]
cli = [ "colorama" ]
docs = [ "myst-parser", "sphinx", "sphinx-copybutton", "sphinx-rtd-theme" ]
fsspec = [ "fsspec>=2021.7" ]

[project.urls]
Homepage = "https://github.com/manfred-kaiser/webdav-rfc4918"
Changelog = "https://github.com/manfred-kaiser/webdav-rfc4918/blob/main/CHANGELOG.md"
Source = "https://github.com/manfred-kaiser/webdav-rfc4918"
Tracker = "https://github.com/manfred-kaiser/webdav-rfc4918/issues"

[tool.hatch.build.targets.wheel]
packages = [ "src/webdav" ]

[tool.hatch.envs.hatch-test]
dependencies = [ "pytest", "pytest-cov", "pytest-xdist", "typing-extensions" ]
extra-dependencies = [ "webdav-rfc4918[all]", "cheroot", "wsgidav" ]

[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args:tests/}"

[[tool.hatch.envs.hatch-test.matrix]]
python = [ "3.11", "3.12", "3.13", "3.14" ]

[tool.hatch.envs.docs]
detached = false
features = [ "docs" ]

[tool.hatch.envs.docs.scripts]
build = [ "sphinx-build docs build/html" ]

[tool.hatch.envs.lint]
detached = false
features = [ "all" ]
dependencies = [
  "bandit",
  "black~=26.0",
  "Flake8-pyproject",
  "flake8",
  "mypy==1.19.1",
  "pylint",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "ruff",
  "types-colorama",
  "types-python-dateutil",
  "types-requests",
  "cheroot",
  "wsgidav",
]

[tool.hatch.envs.lint.scripts]
check = [
  "pytest",
  "black --check src/webdav",
  "bandit -c pyproject.toml -r src/webdav",
  "ruff check src/webdav",
  "flake8 src/webdav",
  "pylint src/webdav",
  "mypy",
]

[[tool.hatch.envs.lint.matrix]]
python = [ "3.11", "3.12", "3.13", "3.14" ]

[tool.flake8]
# E203/W503 are black's own documented flake8 exceptions (black's slice/
# operator-wrap style conflicts with pycodestyle's). E704 joins them for
# the same reason: black's "dummy implementations" style collapses a
# trivial `def foo(): ...` body onto one line (the `@overload` stubs in
# client.py's `open()`) - exactly what E704 flags.
ignore = [ "E203", "E501", "E704", "W503" ]

[tool.black]
target-version = [ "py311" ]

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "ANN401",  # any-type - vorerst ignoriert, Einzelfall
  "ARG002",  # unused-method-argument - vorerst ignoriert, Einzelfall
  "COM812",  # trailing-comma-missing - conflicts with black
  "CPY001",  # missing-copyright-notice - LICENSE already carries it
  "D203",    # one-blank-line-before-class
  "D213",    # multi-line-summary-second-line
  "D401",    # non-imperative-mood - docstring grammar, no effect on correctness/behavior
  "D404",    # docstring-starts-with-this - same, style-only
  "E501",    # line-too-long - black owns line length
  "FBT001",  # boolean-type-hint-positional-argument - vorerst ignoriert
  "FBT002",  # boolean-default-value-positional-argument - vorerst ignoriert
  "FBT003",  # boolean-positional-value-in-call - vorerst ignoriert
  "ISC001",  # single-line-implicit-string-concatenation - conflicts with black
  "PLR2004", # magic-value-comparison - vorerst ignoriert (auch außerhalb tests/)
  "S101",    # assert - vorerst ignoriert (auch außerhalb tests/)
]

[tool.ruff.lint.pylint]
# Client.__init__ has 12 independent, keyword-only configuration params
# (base_url plus 11 keyword-only: auth/session/retry/chunk_size/cert/
# verify/tls/headers/max_response_size/redirect_policy/
# trusted_redirect_origins) - each is independently meaningful and none
# group naturally beyond what TLSOptions already bundles (the
# TLS-internals subset). Kept in sync with [tool.pylint.design].max-args
# below.
max-args = 12

[tool.ruff.lint.per-file-ignores]
"docs/**" = [ "INP001" ]
"src/webdav/cli.py" = [ "T201" ] # it's a CLI, printing to stdout is the point
"tests/**" = [
  "ANN",    # return/argument types not required on test functions
  "D",      # test names are self-documenting, no docstring convention here
  "DTZ002",
  "PGH003", # blanket `type: ignore` is fine in tests
  "S106",
  "S314",
  "SLF001", # tests intentionally reach into internals to set up scenarios
]
"tests/server.py" = [ "T201" ] # interactive test-server helper, not library code

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true # **kwargs passthrough to requests is legitimately dynamic

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.isort]
known-first-party = [ "webdav" ]

[tool.pylint]
disable = [
  "line-too-long",
  "too-many-instance-attributes",
  # Small data holders/protocols with <2 public methods by design
  # (FeatureDetection, Method, PropStat, RetryFunc) - a near-universal
  # pylint nitpick against small, single-purpose classes.
  "too-few-public-methods",
]

[tool.pylint.design]
# Kept in sync with [tool.ruff.lint.pylint].max-args - see its comment.
max-args = 12
max-positional-arguments = 9
# Client is a comprehensive WebDAV facade (ls/info/exists/mkdir/move/copy/
# lock/open/upload/download/props/...), same shape as httpx.Client or
# requests.Session - splitting it into several classes purely to satisfy
# this metric would work against the single-entry-point API this project
# explicitly aims for. A little headroom over its current size (31).
max-public-methods = 34

[tool.pylint.MASTER]
load-plugins = "pylint.extensions.docparams"

[tool.bandit]
# B101 (assert): every use in src/ is an internal type-narrowing check,
# individually reviewed - not input validation or a security boundary.
# B405 (blacklisted xml import): stdlib ElementTree never resolves external
# entities and modern expat (>=2.4.0) rejects billion-laughs amplification
# by default - verified empirically against this project's own Python floor.
skips = [ "B101", "B405" ]

[tool.codespell]
ignore-words-list = "cachable"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
addopts = "-ra -nauto --cov=webdav --cov-report=term-missing"

[tool.coverage.run]
branch = true
concurrency = [ "multiprocessing" ]
parallel = true
source = [ "tests", "webdav" ]

[tool.coverage.paths]
source = [ "src", "*/site-packages" ]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "pass",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.mypy]
show_column_numbers = true
disallow_untyped_calls = true
warn_return_any = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
files = [ "src/webdav", "tests", "docs" ]

[[tool.mypy.overrides]]
module = [ "fsspec.*", "wsgidav.*" ]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [ "tests.*" ]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_unused_ignores = false

[tool.bumpversion]
current_version = "0.1.0"
commit = false
tag = false
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/webdav/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] - {now:%Y-%m-%d}"""
