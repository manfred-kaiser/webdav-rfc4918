[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling==1.31.0" ]

[project]
name = "webdav-rfc4918"
version = "1.2.0"
description = "RFC 4918 compliant WebDAV client, built on requests, with an optional fsspec filesystem and a CLI"
readme = "README.md"
keywords = [ "fsspec", "mtls", "rfc4918", "webdav", "webdav-cli", "webdav-client" ]
license = "MIT"
authors = [ { name = "Manfred Kaiser", email = "manfred.kaiser@ssh-mitm.at" } ]
maintainers = [ { name = "Manfred Kaiser", email = "manfred.kaiser@ssh-mitm.at" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [ "requests>=2.32.4,<3", "urllib3>=2.7.0,<3" ]

[project.scripts]
dav = "webdav.cli:main"

[project.entry-points."fsspec.specs"]
webdav = "webdav.fsspec:WebdavFileSystem"
webdavs = "webdav.fsspec:WebdavFileSystem"

[project.optional-dependencies]
docs = [ "myst-parser", "sphinx", "sphinx-copybutton", "sphinx-rtd-theme" ]
fsspec = [ "fsspec>=2024.12.0" ]

[project.urls]
Homepage = "https://github.com/manfred-kaiser/webdav-rfc4918"
Documentation = "https://webdav.readthedocs.io"
Changelog = "https://github.com/manfred-kaiser/webdav-rfc4918/blob/main/CHANGELOG.md"
Source = "https://github.com/manfred-kaiser/webdav-rfc4918"
Tracker = "https://github.com/manfred-kaiser/webdav-rfc4918/issues"

[tool.hatch.build.targets.wheel]
packages = [ "src/webdav" ]

[tool.hatch.envs.hatch-test]
dependencies = [ "hypothesis", "pytest", "pytest-cov", "pytest-xdist", "typing-extensions" ]
# pandas, dask, pyarrow, zarr and xarray: the programs that use the fsspec filesystem, run in
# tests/test_fsspec_consumers.py - test dependencies only, each test is skipped without its library.
extra-dependencies = [
  "cheroot",
  "dask[dataframe]",
  "fsspec",
  "numpy",
  "pandas",
  "pyarrow",
  "wsgidav",
  "xarray",
  "zarr",
]

[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args:tests/}"

[[tool.hatch.envs.hatch-test.matrix]]
python = [ "3.11", "3.12", "3.13", "3.14" ]

[tool.hatch.envs.docs]
detached = false
features = [ "docs" ]

[tool.hatch.envs.docs.scripts]
build = [ "sphinx-build docs build/html" ]

[tool.hatch.envs.lint]
detached = false
dependencies = [
  "bandit",
  "black~=26.0",
  "Flake8-pyproject",
  "flake8",
  "mypy==1.19.1",
  "pylint",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "ruff",
  "types-requests",
  "cheroot",
  "fsspec",
  "wsgidav",
  "hypothesis",
]

[tool.hatch.envs.lint.scripts]
check = [
  "pytest",
  "black --check src/webdav",
  "bandit -c pyproject.toml -r src/webdav",
  "ruff check src/webdav",
  "flake8 src/webdav",
  "pylint src/webdav",
  "mypy",
]

[[tool.hatch.envs.lint.matrix]]
python = [ "3.11", "3.12", "3.13", "3.14" ]

[tool.flake8]
# __init__.py re-exports the public API .
per-file-ignores = [ "src/webdav/__init__.py:F401" ]
# E203/W503 are black's own documented flake8 exceptions (black's slice/
# operator-wrap style conflicts with pycodestyle's). E704 joins them for
# the same reason: black's "dummy implementations" style collapses a
# trivial `def foo(): ...` body onto one line (the `@overload` stubs in
# fs/client.py's `open()`) - exactly what E704 flags.
ignore = [ "E203", "E501", "E704", "W503" ]

[tool.black]
target-version = [ "py311" ]

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "ANN401",  # any-type - vorerst ignoriert, Einzelfall
  "ARG002",  # unused-method-argument - vorerst ignoriert, Einzelfall
  "COM812",  # trailing-comma-missing - conflicts with black
  "CPY001",  # missing-copyright-notice - LICENSE already carries it
  "D203",    # one-blank-line-before-class
  "D213",    # multi-line-summary-second-line
  "D401",    # non-imperative-mood - docstring grammar, no effect on correctness/behavior
  "D404",    # docstring-starts-with-this - same, style-only
  "E501",    # line-too-long - black owns line length
  "FBT001",  # boolean-type-hint-positional-argument - vorerst ignoriert
  "FBT002",  # boolean-default-value-positional-argument - vorerst ignoriert
  "FBT003",  # boolean-positional-value-in-call - vorerst ignoriert
  "ISC001",  # single-line-implicit-string-concatenation - conflicts with black
  "PLR2004", # magic-value-comparison - vorerst ignoriert (auch außerhalb tests/)
  "S101",    # assert - vorerst ignoriert (auch außerhalb tests/)
]

[tool.ruff.lint.pylint]
# Session.__init__ has 18 independent configuration params (base_url plus
# 17 keyword-only: auth/headers/cert/verify/tls/timeout/redirect_policy/
# trusted_redirect_origins/max_response_size/max_response_time/
# max_redirects/pool_connections/pool_maxsize/retry/chunk_size/
# raise_on_error/response_class) - each is independently meaningful and
# none group naturally beyond what TLSOptions already bundles (the
# TLS-internals subset). Kept in sync with [tool.pylint.design].max-args
# below.
max-args = 18

[tool.ruff.lint.per-file-ignores]
"docs/**" = [ "INP001" ]
"tools/**" = [ "INP001", "S603", "T201" ] # standalone scripts, not a package - printing status is the point
"src/webdav/cli.py" = [ "T201" ] # it's a CLI, printing to stdout is the point
"tests/**" = [
  "ANN",    # return/argument types not required on test functions
  "D",      # test names are self-documenting, no docstring convention here
  "DTZ002",
  "PGH003", # blanket `type: ignore` is fine in tests
  "S106",
  "S314",
  "SLF001", # tests intentionally reach into internals to set up scenarios
]
# Test infrastructure (standing a throwaway Apache/nginx/Nextcloud instance
# up/down), not a test itself - same reasoning as tools/** below: a fixed
# list of trusted, hardcoded binaries (httpd, htpasswd, nginx, docker),
# nothing from untrusted input.
"tests/apache_instance.py" = [ "S603" ]
"tests/nginx_instance.py" = [ "S603" ]
"tests/nextcloud_instance.py" = [ "S603" ]
"tests/server.py" = [ "T201" ] # interactive test-server helper, not library code

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true # **kwargs passthrough to requests is legitimately dynamic

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.isort]
known-first-party = [ "webdav" ]

[tool.pylint]
disable = [
  "line-too-long",
  "too-many-instance-attributes",
  # Small data holders/protocols with <2 public methods by design
  # (FeatureDetection, Method, PropStat, RetryFunc) - a near-universal
  # pylint nitpick against small, single-purpose classes.
  "too-few-public-methods",
  # fs/api.py mirrors FileSystem on purpose (same signatures, thin delegation).
  "duplicate-code",
  # urllib3 connections get request/getresponse from http.client; pylint cannot see it.
  "no-member",
]


[tool.pylint.design]
# Kept in sync with [tool.ruff.lint.pylint].max-args - see its comment.
max-args = 18
max-parents = 8  # the exception hierarchy is deliberately fine-grained
# Session.__init__: every keyword-only argument counts as a local (see max-args).
max-locals = 20
max-positional-arguments = 9
# Session is the single entry point for the HTTP/WebDAV verbs, like
# requests.Session is for HTTP, and forwards the requests attributes
# (headers, auth, verify, ... - each a getter/setter pair) - splitting it
# into several classes purely to satisfy this metric would work against the
# one-object API this project explicitly aims for. A little headroom over
# its current size (41).
max-public-methods = 44

[tool.pylint.MASTER]
load-plugins = "pylint.extensions.docparams"

[tool.pylint.format]
# FileSystem is the single entry point for the file-system-shaped API, like
# Session is for the HTTP/WebDAV verbs (see max-public-methods above) -
# splitting it purely to satisfy this metric would work against that. A
# little headroom over its current size.
max-module-lines = 1200

[tool.bandit]
# B101 (assert): every use in src/ is an internal type-narrowing check,
# individually reviewed - not input validation or a security boundary.
# B405 (blacklisted xml import): stdlib ElementTree never resolves external
# entities and modern expat (>=2.4.0) rejects billion-laughs amplification
# by default - verified empirically against this project's own Python floor.
skips = [ "B101", "B405" ]

[tool.codespell]
ignore-words-list = "cachable"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
addopts = "-ra -nauto --dist=loadgroup --cov=webdav --cov-report=term-missing"

[tool.coverage.run]
branch = true
concurrency = [ "multiprocessing" ]
parallel = true
source = [ "tests", "webdav" ]

[tool.coverage.paths]
source = [ "src", "*/site-packages" ]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "pass",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.mypy]
show_column_numbers = true
disallow_untyped_calls = true
warn_return_any = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
files = [ "src/webdav", "tests", "docs" ]

[[tool.mypy.overrides]]
module = [ "fsspec", "fsspec.*", "wsgidav.*" ]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [ "tests.*" ]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_unused_ignores = false

[tool.bumpversion]
current_version = "1.2.0"
commit = false
tag = false
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/webdav/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] - {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/manfred-kaiser/webdav-rfc4918/compare/{current_version}...main"
replace = """[Unreleased]: https://github.com/manfred-kaiser/webdav-rfc4918/compare/{new_version}...main
[{new_version}]: https://github.com/manfred-kaiser/webdav-rfc4918/releases/tag/{new_version}"""
